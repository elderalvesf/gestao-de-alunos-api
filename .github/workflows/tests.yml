name: Testes de API

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env a partir do .env.example
        run: |
          cp .env.example .env
          sed -i 's#^MONGODB_URI=.*#MONGODB_URI=mongodb://127.0.0.1:27017/gestao-de-alunos-test#' .env

      - name: Subir a API em segundo plano
        run: |
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && echo "API no ar" && exit 0
            sleep 2
          done
          echo "A API não subiu a tempo" && cat api.log && exit 1

      - name: Executar testes
        run: npm test

      - name: Logs da API
        if: always()
        run: cat api.log
